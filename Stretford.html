<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manchester United · Season Dashboard</title>
<style>
  :root {
    --bg: #f4f4f2; --surface: #ffffff; --ink: #111111; --muted: #6b6b6b; --line: #e4e4e1;
    --red: #DA291C; --gold: #FBE122; --win: #15803d; --draw: #8a8a8a; --loss: #DA291C;
    --radius: 12px; --pad: clamp(12px, 3vw, 24px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0c0c0c; --surface: #161616; --ink: #f5f5f5; --muted: #9a9a9a; --line: #262626; }
  }
  :root[data-theme="dark"] { --bg: #0c0c0c; --surface: #161616; --ink: #f5f5f5; --muted: #9a9a9a; --line: #262626; }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header { background: var(--red); color: #fff; border-bottom: 4px solid var(--gold); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: var(--pad); }
  .top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
  h1 { font-size: clamp(18px, 3vw, 24px); margin: 0; font-weight: 700; letter-spacing: .01em; }
  .sub { font-size: 12px; opacity: .85; }
  .badge { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: #111; font-size: 11px; font-weight: 700; vertical-align: middle; }

  .seasons { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .seasons::-webkit-scrollbar { display: none; }
  .seasons button {
    flex: none; border: 1px solid rgba(255,255,255,.4); background: transparent; color: #fff;
    padding: 6px 12px; border-radius: 999px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .seasons button[aria-pressed="true"] { background: #fff; color: var(--red); border-color: #fff; }

  main { display: grid; gap: 16px; padding-top: var(--pad); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  .kpi .v { font-size: clamp(22px, 4vw, 30px); font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--muted); }

  .split { display: grid; gap: 16px; }
  @media (min-width: 900px) { .split { grid-template-columns: 1.4fr 1fr; } }

  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  th:first-child, td:first-child, th.name, td.name { text-align: left; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.us td { background: rgba(218, 41, 28, .08); font-weight: 600; }
  td.pts { font-weight: 700; }

  .form { display: inline-flex; gap: 3px; }
  .form i {
    font-style: normal; width: 18px; height: 18px; border-radius: 4px; color: #fff;
    display: inline-grid; place-items: center; font-size: 10px; font-weight: 700;
  }
  .form .W { background: var(--win); } .form .D { background: var(--draw); } .form .L { background: var(--loss); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  select {
    font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
  }
  .pos { color: var(--muted); font-size: 12px; }

  .bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 8px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar-pair { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 2px; width: 100%; justify-content: center; }
  .bar { width: min(10px, 35%); border-radius: 3px 3px 0 0; min-height: 2px; }
  .bar.gf { background: var(--red); } .bar.ga { background: var(--muted); opacity: .6; }
  .bar-label { font-size: 11px; color: var(--muted); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .gf::before { background: var(--red); } .legend .ga::before { background: var(--muted); opacity: .6; }

  .note { font-size: 12px; color: var(--muted); padding: 0 var(--pad) 24px; }
  .note a { color: inherit; }
  .empty { text-align: left; color: var(--muted); white-space: normal; }
  .res { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 4px; color: #fff; font-size: 11px; font-weight: 700; }
  .res.W { background: var(--win); } .res.D { background: var(--draw); } .res.L { background: var(--loss); }
  tr.upcoming td { color: var(--muted); }

  @media (max-width: 599px) {
    .hide-sm { display: none; }
    th, td { padding: 7px 4px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap top">
    <div>
      <h1>Manchester United <span class="badge" id="status">LOADING</span></h1>
      <div class="sub" id="meta"></div>
    </div>
    <nav class="seasons" id="seasons" aria-label="Season"></nav>
  </div>
</header>

<main class="wrap">

  <section class="card">
    <h2 id="kpi-title">Season overview</h2>
    <div class="kpis" id="kpis"></div>
  </section>

  <div class="split">
    <section class="card">
      <h2>League table</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>#</th><th class="name">Club</th><th>P</th><th>W</th><th>D</th><th>L</th>
              <th class="hide-sm">GF</th><th class="hide-sm">GA</th><th>GD</th><th>Pts</th><th class="hide-sm">Form</th>
            </tr>
          </thead>
          <tbody id="standings"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Goals by month</h2>
      <div class="bars" id="bars"></div>
      <div class="legend"><span class="gf">Scored</span><span class="ga">Conceded</span></div>
    </section>
  </div>

  <section class="card">
    <div class="toolbar">
      <h2 style="margin:0">Results &amp; fixtures</h2>
      <label class="pos">Show
        <select id="filter">
          <option value="all">All matches</option>
          <option value="results">Results</option>
          <option value="fixtures">Fixtures</option>
        </select>
      </label>
    </div>
    <div class="scroll">
      <table>
        <thead>
          <tr><th class="name">Date</th><th class="name">Opponent</th><th>H/A</th><th>Score</th><th>Result</th></tr>
        </thead>
        <tbody id="matches"></tbody>
      </table>
    </div>
  </section>

</main>

<p class="note">Premier League data from <a href="https://github.com/openfootball/football.json">openfootball</a> (free, no API key). Results are added by volunteers and can lag a few days behind.</p>

<script>
  const FEED = "https://raw.githubusercontent.com/openfootball/football.json/master";
  const MY_TEAM = "Manchester United FC";
  const MONTHS = ["Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May"];
  const SEASONS = ["2026-27", "2025-26", "2024-25"];

  // The feed writes most scores as { ft: [h, a] } but some goalless draws as a bare [0, 0].
  const scoreOf = m => Array.isArray(m.score) ? m.score : (m.score && m.score.ft) || null;
  const shortName = n => n.replace(/^AFC /, "").replace(/ A?FC$/, "");
  const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const monthOf = date => MONTH_NAMES[+date.slice(5, 7) - 1];
  const fmtDate = (date, opts) => new Date(date + "T12:00:00Z").toLocaleDateString("en-GB", { timeZone: "UTC", ...opts });
  const today = new Date().toISOString().slice(0, 10);

  function buildSeason(id, data) {
    const matches = [...data.matches].sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
    const played = matches.filter(scoreOf);

    const rows = {};
    const row = team => rows[team] || (rows[team] = { team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, results: [] });
    matches.forEach(m => { row(m.team1); row(m.team2); });

    for (const m of played) {
      const [h, a] = scoreOf(m);
      for (const [team, f, ag] of [[m.team1, h, a], [m.team2, a, h]]) {
        const r = row(team);
        const res = f > ag ? "W" : f < ag ? "L" : "D";
        r.p++; r.gf += f; r.ga += ag; r.results.push(res);
        if (res === "W") r.w++; else if (res === "L") r.l++; else r.d++;
      }
    }

    const standings = Object.values(rows)
      .map(r => ({ ...r, gd: r.gf - r.ga, pts: r.w * 3 + r.d, form: r.results.slice(-5) }))
      .sort((x, y) => y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.team.localeCompare(y.team));

    const fixtures = matches
      .filter(m => m.team1 === MY_TEAM || m.team2 === MY_TEAM)
      .map(m => {
        const home = m.team1 === MY_TEAM;
        const sc = scoreOf(m);
        const [f, a] = sc ? (home ? sc : [sc[1], sc[0]]) : [null, null];
        return {
          date: m.date, time: m.time, home,
          opponent: home ? m.team2 : m.team1,
          gf: f, ga: a,
          result: sc ? (f > a ? "W" : f < a ? "L" : "D") : null
        };
      });

    const done = fixtures.filter(x => x.result);
    const lastMonth = done.length ? MONTHS.indexOf(monthOf(done[done.length - 1].date)) : -1;
    const monthly = MONTHS.slice(0, lastMonth + 1).map(m => {
      const inMonth = done.filter(x => monthOf(x.date) === m);
      return { m, gf: inMonth.reduce((s, x) => s + x.gf, 0), ga: inMonth.reduce((s, x) => s + x.ga, 0) };
    });

    return {
      id, label: id.replace("-", "/"),
      live: played.length < matches.length,
      lastResult: played.length ? played[played.length - 1].date : null,
      standings, fixtures, monthly
    };
  }

  const cache = {};
  function getSeason(id) {
    if (!cache[id]) {
      cache[id] = fetch(`${FEED}/${id}/en.1.json`)
        .then(res => { if (!res.ok) throw new Error(`Feed returned ${res.status}`); return res.json(); })
        .then(data => buildSeason(id, data))
        .catch(err => { delete cache[id]; throw err; });
    }
    return cache[id];
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtGD = n => (n > 0 ? "+" : "") + n;

  const $ = id => document.getElementById(id);
  let current = SEASONS[0];
  let filter = "all";
  let season = null;
  let requestId = 0;

  function renderSeasonButtons() {
    $("seasons").innerHTML = SEASONS.map(id =>
      `<button type="button" data-id="${id}" aria-pressed="${id === current}">${id.replace("-", "/")}</button>`
    ).join("");
  }

  function renderKpis(s) {
    const idx = s.standings.findIndex(r => r.team === MY_TEAM);
    const me = s.standings[idx];
    $("kpi-title").textContent = `${s.label} · ${s.live ? "In progress" : "Final"}`;
    $("kpis").innerHTML = [
      ["Position", `${idx + 1}`],
      ["Points", me.pts],
      ["Record", `${me.w}-${me.d}-${me.l}`],
      ["Goals", `${me.gf}:${me.ga}`],
      ["Goal diff", fmtGD(me.gd)],
      ["Pts / game", (me.pts / me.p || 0).toFixed(2)]
    ].map(([l, v]) => `<div class="kpi"><div class="v">${esc(v)}</div><div class="l">${l}</div></div>`).join("");
    const upTo = s.lastResult ? ` · results to ${fmtDate(s.lastResult, { day: "numeric", month: "short", year: "numeric" })}` : "";
    $("meta").textContent = `${s.label} · ${me.p} of 38 played${upTo}`;
  }

  function renderStandings(s) {
    $("standings").innerHTML = s.standings.map((r, i) => `
      <tr class="${r.team === MY_TEAM ? "us" : ""}">
        <td>${i + 1}</td>
        <td class="name">${esc(shortName(r.team))}</td>
        <td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
        <td class="hide-sm">${r.gf}</td><td class="hide-sm">${r.ga}</td>
        <td>${fmtGD(r.gd)}</td>
        <td class="pts">${r.pts}</td>
        <td class="hide-sm"><span class="form">${r.form.map(f => `<i class="${f}">${f}</i>`).join("")}</span></td>
      </tr>`).join("");
  }

  function renderBars(s) {
    if (!s.monthly.length) {
      $("bars").innerHTML = `<p class="pos">No results yet.</p>`;
      return;
    }
    const max = Math.max(1, ...s.monthly.flatMap(m => [m.gf, m.ga]));
    $("bars").innerHTML = s.monthly.map(m => `
      <div class="bar-group" title="${m.m}: ${m.gf} scored, ${m.ga} conceded">
        <div class="bar-pair">
          <div class="bar gf" style="height:${(m.gf / max) * 100}%"></div>
          <div class="bar ga" style="height:${(m.ga / max) * 100}%"></div>
        </div>
        <div class="bar-label">${m.m}</div>
      </div>`).join("");
  }

  function renderMatches(s) {
    const rows = s.fixtures.filter(x =>
      filter === "all" || (filter === "results" ? x.result : !x.result));
    if (!rows.length) {
      $("matches").innerHTML = `<tr><td class="empty" colspan="5">No ${filter === "fixtures" ? "fixtures" : "matches"} to show.</td></tr>`;
      return;
    }
    $("matches").innerHTML = rows.map(x => {
      const date = fmtDate(x.date, { weekday: "short", day: "numeric", month: "short" });
      const score = x.result ? `${x.gf}–${x.ga}` : esc(x.time || "TBC");
      const result = x.result
        ? `<span class="res ${x.result}">${x.result}</span>`
        : `<span class="pos">${x.date < today ? "Awaiting" : "–"}</span>`;
      return `
      <tr class="${x.result ? "" : "upcoming"}">
        <td class="name">${date}</td>
        <td class="name">${esc(shortName(x.opponent))}</td>
        <td>${x.home ? "H" : "A"}</td>
        <td>${score}</td>
        <td>${result}</td>
      </tr>`;
    }).join("");
  }

  function setStatus(text) { $("status").textContent = text; }

  async function render() {
    const id = ++requestId;
    setStatus("LOADING");
    try {
      const s = await getSeason(current);
      if (id !== requestId) return;
      season = s;
      setStatus(s.live ? "LIVE FEED" : "FINAL");
      renderKpis(s);
      renderStandings(s);
      renderBars(s);
      renderMatches(s);
    } catch (err) {
      if (id !== requestId) return;
      season = null;
      setStatus("OFFLINE");
      $("meta").textContent = `Couldn't load ${current.replace("-", "/")}: ${err.message}`;
      $("kpis").innerHTML = `<p class="pos">Data feed unavailable. Check your connection and pick the season again to retry.</p>`;
      $("standings").innerHTML = $("bars").innerHTML = $("matches").innerHTML = "";
    }
  }

  $("seasons").addEventListener("click", e => {
    const btn = e.target.closest("button[data-id]");
    if (!btn || (btn.dataset.id === current && season)) return;
    current = btn.dataset.id;
    renderSeasonButtons();
    render();
  });

  $("filter").addEventListener("change", e => {
    filter = e.target.value;
    if (season) renderMatches(season);
  });

  renderSeasonButtons();
  render();
</script>
</body>
</html>
