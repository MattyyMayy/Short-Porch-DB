<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Short Porch DB · New York Yankees</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<script>
  try {

    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
</script>
<style>
  :root {
    --navy: #0C2340; --stripe: rgba(255, 255, 255, .16); --gray: #C4CED3;
    --surface: #f4efe1; --ink: #0C2340; --muted: #5b6577; --line: #cfc7b0; --hi: rgba(12, 35, 64, .12);
    --accent: #0C2340; --win: #1f8a3b; --tie: #7d7d7d; --loss: #c8102e;
    --edge: #061224; --shadow: 6px 6px 0 rgba(0, 0, 0, .45);
    --pixel: "Press Start 2P", "Courier New", monospace;
    --term: "VT323", ui-monospace, "Courier New", monospace;
    --pad: clamp(12px, 3vw, 24px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --surface: #0a1426; --ink: #e9edf4; --muted: #8e9bb2; --line: #22324d; --hi: rgba(143, 176, 217, .16); --accent: #8fb0d9; --edge: #000; }
  }
  :root[data-theme="dark"] { --surface: #0a1426; --ink: #e9edf4; --muted: #8e9bb2; --line: #22324d; --hi: rgba(143, 176, 217, .16); --accent: #8fb0d9; --edge: #000; }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--navy); }
  /* Navy pinstripes behind the whole page, drawn on a 2px pixel grid. */
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: repeating-linear-gradient(90deg, transparent 0 26px, var(--stripe) 26px 28px), var(--navy);
    background-attachment: fixed;
    font: 20px/1.2 var(--term);
    -webkit-font-smoothing: none; font-smooth: never;
  }

  header { color: #fff; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: var(--pad); }
  .top { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; justify-content: space-between; }
  .tagline { font-size: clamp(24px, 3.5vw, 30px); line-height: 1.1; color: #fff; text-shadow: 2px 2px 0 var(--edge); margin-bottom: 4px; }
  .tagline::before { content: "> "; color: var(--loss); }
  h1 {
    font: clamp(14px, 3vw, 24px)/1.5 var(--pixel); margin: 6px 0; text-transform: uppercase;
    text-shadow: 3px 3px 0 var(--edge); display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  }
  .ball { width: 28px; height: 28px; flex: none; filter: drop-shadow(3px 3px 0 var(--edge)); }
  .sub { font-size: 20px; color: var(--gray); }
  .badge {
    display: inline-block; padding: 4px 6px 3px; background: #fff; color: var(--navy);
    font: 10px/1 var(--pixel); text-shadow: none; box-shadow: 3px 3px 0 var(--edge);
  }
  .badge.live { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .badge.live { animation: none; } }

  .actions { display: flex; align-items: center; gap: 12px; min-width: 0; max-width: 100%; }
  .lights {
    flex: none; width: 78px; height: 66px; padding: 3px 4px; margin: 0 3px 3px 0; cursor: pointer;
    background: var(--navy); border: 3px solid #fff; box-shadow: 3px 3px 0 var(--edge);
  }
  .lights:hover { background: #17345c; }
  .lights:active { transform: translate(3px, 3px); box-shadow: none; }
  .lights:focus-visible, .seasons button:focus-visible, select:focus-visible { outline: 3px dashed var(--loss); outline-offset: 3px; }
  .flood { display: block; width: 100%; height: 100%; }
  .flood .frame { fill: #C4CED3; }
  .flood .pole { fill: #7d8aa0; }
  .flood .frieze { fill: #f2f1ea; }
  .flood .lamp { fill: #2a3346; }
  .flood .ray { fill: #ffe14d; visibility: hidden; }
  .lights[aria-pressed="true"] .flood { filter: drop-shadow(0 0 6px rgba(255, 236, 140, .95)); }
  .lights[aria-pressed="true"] .flood .lamp { fill: #fff8c4; }
  .lights[aria-pressed="true"] .flood .ray { visibility: visible; animation: flicker 1.6s steps(1) infinite; }
  @keyframes flicker { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .lights[aria-pressed="true"] .flood .ray { animation: none; } }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .seasons { display: flex; gap: 8px; min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 0 6px 6px 0; }
  .seasons::-webkit-scrollbar { display: none; }
  .seasons button {
    flex: none; border: 3px solid #fff; background: var(--navy); color: #fff;
    padding: 6px 10px 5px; font: 10px/1 var(--pixel); cursor: pointer; box-shadow: 3px 3px 0 var(--edge);
  }
  .seasons button:hover { background: #17345c; }
  .seasons button[aria-pressed="true"] { background: #fff; color: var(--navy); transform: translate(3px, 3px); box-shadow: none; }

  main { display: grid; gap: 20px; padding-top: 4px; }
  .card {
    background: var(--surface); border: 4px solid var(--edge); padding: 16px; min-width: 0;
    box-shadow: var(--shadow);
  }
  .card h2 { font: 11px/1.4 var(--pixel); text-transform: uppercase; color: var(--ink); margin: 0 0 14px; }
  .card h2::before { content: "■ "; color: var(--loss); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 12px; }
  .kpi { border: 2px dashed var(--line); padding: 8px 10px; }
  .kpi .v { font-size: clamp(34px, 5vw, 44px); line-height: 1; }
  .kpi .l { font-size: 18px; color: var(--muted); text-transform: uppercase; }
  .kpi-note { grid-column: 1 / -1; margin: 0; font-size: 18px; color: var(--muted); }

  .split { display: grid; gap: 20px; }
  @media (min-width: 900px) { .split { grid-template-columns: 1.4fr 1fr; } }

  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* Long tables scroll inside their card so the page stays short. */
  .scroll.tall {
    max-height: min(440px, 62vh); overflow-y: auto; overscroll-behavior: contain;
    border-bottom: 3px solid var(--ink);
    scrollbar-color: var(--muted) transparent;
  }
  .scroll.tall thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 0; box-shadow: inset 0 -3px 0 var(--ink); }
  .hint { margin: -4px 0 10px; font-size: 18px; }
  .scroll.tall::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll.tall::-webkit-scrollbar-thumb { background: var(--muted); }

  /* Player rows open a month-by-month chart. */
  #players tr.player { cursor: pointer; }
  #players tr.player td[data-stat]:hover { text-decoration: underline dotted; }
  #players tr.open td { background: var(--hi); }
  #players tr.open td:first-child { box-shadow: inset 4px 0 0 var(--loss); }
  #players td.picked { outline: 3px solid var(--loss); outline-offset: -3px; }
  #players-box .bio { border-left: 3px dashed var(--line); }
  .caret { display: inline-block; width: 14px; color: var(--muted); }
  tr.detail > td { padding: 10px 12px 14px; background: var(--hi); text-align: left; white-space: normal; }
  #players tr.detail:hover td { background: var(--hi); }
  .trend-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .trend-head b { font: 10px/1.4 var(--pixel); text-transform: uppercase; font-weight: normal; }
  .trend-head .pos { font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips button {
    font: 18px/1 var(--term); padding: 3px 7px 2px; cursor: pointer; color: var(--ink);
    background: var(--surface); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--edge);
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); transform: translate(2px, 2px); box-shadow: none; }
  .chips button:focus-visible, #players tr.player:focus-visible { outline: 3px dashed var(--loss); outline-offset: 2px; }
  /* Sized to the visible box and pinned left, so it stays in view when the table scrolls sideways. */
  .detail-in { position: sticky; left: 12px; }
  .trend-chart { position: relative; }
  .trend-chart svg { display: block; overflow: visible; }
  .trend-chart .grid { stroke: var(--line); stroke-width: 1; }
  .trend-chart .axis { stroke: var(--ink); stroke-width: 2; }
  .trend-chart text { fill: var(--muted); font: 16px var(--term); }
  .trend-chart .me { stroke: var(--accent); stroke-width: 3; fill: none; }
  .trend-chart .lg { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  .trend-chart .dot-me { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .trend-chart .dot-lg { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
  .trend-chart .lbl-me { fill: var(--ink); }
  .trend-chart .hit { fill: transparent; cursor: crosshair; }
  .trend-chart .cross { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 2; visibility: hidden; }
  .tip {
    position: absolute; pointer-events: none; background: var(--surface); color: var(--ink); border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--edge); padding: 4px 8px; font-size: 18px; line-height: 1.1; white-space: nowrap; visibility: hidden; z-index: 2;
  }
  .tip .m { color: var(--muted); }
  .trend-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 18px; margin-top: 4px; }
  .trend-legend span::before { content: ""; display: inline-block; width: 18px; height: 0; margin-right: 6px; vertical-align: 4px; }
  .trend-legend .me::before { border-top: 3px solid var(--accent); }
  .trend-legend .lg::before { border-top: 2px dashed var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 5px 7px; text-align: right; border-bottom: 2px dotted var(--line); white-space: nowrap; }
  th { font-size: 18px; color: var(--muted); font-weight: normal; text-transform: uppercase; border-bottom: 3px solid var(--ink); }
  th:first-child, td:first-child, th.name, td.name { text-align: left; }
  /* Headshots are portrait (~2:3); crop to a centered square so neither the cap nor the chin is lost. */
  .hs { width: 40px; height: 40px; object-fit: cover; object-position: center; vertical-align: middle; margin-right: 8px; background: var(--hi); border: 2px solid var(--ink); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--hi); }
  tr.us td { background: var(--hi); }
  tr.us td:first-child { box-shadow: inset 4px 0 0 var(--loss); }
  .clinch { color: var(--muted); margin-left: 4px; }

  .streak.W { color: var(--win); } .streak.L { color: var(--loss); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0 !important; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  select {
    font: 20px/1 var(--term); padding: 3px 6px; border: 3px solid var(--ink); border-radius: 0;
    background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--edge); cursor: pointer;
  }
  .pos { color: var(--muted); }

  .bars {
    display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 8px;
    border-bottom: 3px solid var(--ink);
    background: repeating-linear-gradient(0deg, transparent 0 34px, var(--line) 34px 36px);
  }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
  .bar-pair { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 3px; width: 100%; justify-content: center; }
  /* Bars snap to 6px steps so they read as stacked pixel blocks. */
  .bar { width: min(14px, 40%); min-height: 6px; }
  .bar.rf { background: repeating-linear-gradient(0deg, var(--accent) 0 4px, transparent 4px 6px); }
  .bar.ra { background: repeating-linear-gradient(0deg, var(--muted) 0 4px, transparent 4px 6px); opacity: .6; }
  .bar.none { min-height: 0; }
  .bar-labels { display: flex; gap: 6px; }
  .bar-label { flex: 1; text-align: center; font-size: 18px; color: var(--muted); padding-top: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
  .legend .rf::before { background: var(--accent); } .legend .ra::before { background: var(--muted); opacity: .6; }

  .note { font-size: 18px; color: var(--gray); padding: 8px var(--pad) 28px; max-width: 1200px; margin: 0 auto; }
  .note a { color: #fff; }
  .empty { text-align: left; color: var(--muted); white-space: normal; }
  .res { display: inline-grid; place-items: center; width: 24px; height: 24px; color: #fff; font: 10px/1 var(--pixel); box-shadow: 2px 2px 0 var(--edge); }
  .res.W { background: var(--win); } .res.T { background: var(--tie); } .res.L { background: var(--loss); }
  .tag { display: inline-block; margin-left: 6px; padding: 0 5px; border: 2px solid var(--muted); color: var(--muted); font-size: 16px; text-transform: uppercase; }
  tr.upcoming td { color: var(--muted); }
  td.box { padding-top: 4px; padding-bottom: 4px; }
  table.line { width: auto; margin-left: auto; border-collapse: collapse; }
  table.line th, table.line td {
    padding: 0 4px; min-width: 18px; text-align: center; border: 0; font-size: 18px; line-height: 1.05; background: none !important; box-shadow: none !important;
  }
  table.line th { color: var(--muted); }
  table.line th:first-child, table.line td:first-child { text-align: left; padding-right: 8px; }
  table.line .rhe { border-left: 2px solid var(--line); padding-left: 6px; }
  table.line tr.me td { color: var(--ink); font-weight: bold; }
  table.line tbody tr:first-child td { border-bottom: 2px dotted var(--line); }
  tr.upcoming table.line td { color: var(--muted); }

  .show-sm { display: none; }
  @media (max-width: 599px) {
    .hide-sm { display: none; }
    .show-sm { display: inline; }
    table.line th, table.line td { padding: 0 2px; min-width: 14px; }
    table.line th:first-child, table.line td:first-child { padding-right: 4px; }
    table.line .rhe { padding-left: 4px; }
    .tag { margin-left: 3px; padding: 0 3px; font-size: 14px; }
    #games > tr > td { padding-left: 3px; padding-right: 3px; }
    th, td { padding: 4px 4px; }
    body { font-size: 19px; }
  }
</style>
</head>

<rect class="frieze" x="7" y="18" width="1" height="1"/><rect class="frieze" x="10" y="12" width="1" height="4"/><rect class="frieze" x="12" y="12" width="1" height="4"/><rect class="frieze" x="14" y="12" width="1" height="4"/><rect class="frieze" x="9" y="16" width="7" height="1"/><rect class="frieze" x="9" y="17" width="2" height="1"/><rect class="frieze" x="14" y="17" width="2" height="1"/><rect class="frieze" x="9" y="18" width="1" height="1"/><rect class="frieze" x="15" y="18" width="1" height="1"/><rect class="frieze" x="18" y="12" width="1" height="4"/><rect class="frieze" x="20" y="12" width="1" height="4"/><rect class="frieze" x="22" y="12" width="1" height="4"/><rect class="frieze" x="17" y="16" width="7" height="1"/><rect class="frieze" x="17" y="17" width="2" height="1"/><rect class="frieze" x="22" y="17" width="2" height="1"/><rect class="frieze" x="17" y="18" width="1" height="1"/><rect class="frieze" x="23" y="18" width="1" height="1"/></svg><span class="visually-hidden">Stadium lights (light mode)</span></button>

<p class="note" id="note"></p>

<script>
  // Data is written to data/ by .github/workflows/update-data.yml, which reads
  // the MLB Stats API (statsapi.mlb.com) on a schedule.
  const DATA = "data";
  const MONTHS = ["Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov"];
  const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const GAMES_PER_SEASON = 162;
  const ROUND = { F: "Wild Card", D: "ALDS", L: "ALCS", W: "World Series" };
  const NOT_PLAYED = /postponed|cancel|suspended/i;

  // Rate stats need a minimum sample; players below it sort after those above.
  const MIN_PA = 50;
  const MIN_OUTS = 60; // 20 innings
  const MIN_FIELD_OUTS = 150; // 50 innings at a position

  const avg3 = v => v == null ? "–" : v.toFixed(3).replace(/^0/, "");
  const fix2 = v => v == null ? "–" : v.toFixed(2);
  const htFmt = v => v == null ? "–" : `${Math.floor(v / 12)}'${v % 12}"`;
  const dash = v => v ?? "–";

  // Age, height and weight sit at the right end of every player table.
  const BIO_HEAD = `<th class="bio" title="Age on June 30 of the season">Age</th><th class="hide-sm">Ht</th><th class="hide-sm">Wt</th>`;
  const bio = p => [["age", dash(p.age), "bio"], ["ht", htFmt(p.ht), "hide-sm"], ["wt", dash(p.wt), "hide-sm"]];

  const STATS = {
    hitters: {
      label: "hitting",
      pos: true,
      sorts: [
        ["ops", "OPS"], ["hr", "Home runs"], ["rbi", "RBI"], ["avg", "Average"], ["sb", "Stolen bases"], ["pa", "Plate appearances"], ["age", "Age"]
      ],
      rate: new Set(["ops", "avg"]),
      qualified: p => p.pa >= MIN_PA,
      head: `<tr><th class="name">Player</th><th>Pos</th><th>G</th><th class="hide-sm">PA</th><th>AVG</th><th>HR</th><th>RBI</th><th class="hide-sm">SB</th><th class="hide-sm">OBP</th><th class="hide-sm">SLG</th><th>OPS</th>${BIO_HEAD}</tr>`,
      row: p => [["g", p.g], ["pa", p.pa, "hide-sm"], ["avg", avg3(p.avg)], ["hr", p.hr], ["rbi", p.rbi], ["sb", p.sb, "hide-sm"], ["obp", avg3(p.obp), "hide-sm"], ["slg", avg3(p.slg), "hide-sm"], ["ops", avg3(p.ops)], ...bio(p)]
    },
    pitchers: {
      label: "pitching",
      sorts: [
        ["outs", "Innings"], ["era", "ERA"], ["so", "Strikeouts"], ["whip", "WHIP"], ["w", "Wins"], ["sv", "Saves"], ["age", "Age"]
      ],
      rate: new Set(["era", "whip"]),
      ascending: new Set(["era", "whip"]),
      qualified: p => p.outs >= MIN_OUTS,
      head: `<tr><th class="name">Player</th><th>G</th><th class="hide-sm">GS</th><th>IP</th><th>W-L</th><th class="hide-sm">SV</th><th>ERA</th><th class="hide-sm">WHIP</th><th>K</th><th class="hide-sm">BB</th>${BIO_HEAD}</tr>`,
      row: p => [["g", p.g], ["gs", p.gs, "hide-sm"], ["ip", esc(p.ip)], ["w", `${p.w}-${p.l}`], ["sv", p.sv, "hide-sm"], ["era", fix2(p.era)], ["whip", fix2(p.whip), "hide-sm"], ["so", p.so], ["bb", p.bb, "hide-sm"], ...bio(p)]
    },
    // One row per player per position.
    fielders: {
      label: "fielding",
      pos: true,
      sorts: [
        ["outs", "Innings"], ["fpct", "Fielding %"], ["po", "Putouts"], ["a", "Assists"], ["dp", "Double plays"], ["e", "Errors"], ["rf9", "Range factor"], ["age", "Age"]
      ],
      rate: new Set(["fpct", "rf9"]),
      qualified: p => p.outs >= MIN_FIELD_OUTS,
      head: `<tr><th class="name">Player</th><th>Pos</th><th>G</th><th class="hide-sm">GS</th><th>Inn</th><th class="hide-sm">TC</th><th>PO</th><th>A</th><th>E</th><th class="hide-sm">DP</th><th>FLD%</th><th class="hide-sm">RF/9</th>${BIO_HEAD}</tr>`,
      row: p => [["g", p.g], ["gs", p.gs, "hide-sm"], ["inn", esc(p.inn)], ["tc", p.tc, "hide-sm"], ["po", p.po], ["a", p.a], ["e", p.e], ["dp", p.dp, "hide-sm"], ["fpct", avg3(p.fpct)], ["rf9", fix2(p.rf9), "hide-sm"], ...bio(p)]
    }
  };

  // Month chart: Yankees beside opponents. Runs come from the schedule and
  // include the postseason; the rest are regular-season team stats, where
  // "opponents" is what was hit against Yankees pitching.
  const pct1 = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
  const ratio = (a, b) => (b > 0 && Number.isFinite(a / b) ? a / b : null);
  const add = (a, b) => (a == null || b == null ? null : a + b);
  const OBP = l => ratio(l.h + l.bb + l.hbp, l.ab + l.bb + l.hbp + l.sf);
  const SLG = l => ratio(l.h + l.d + 2 * l.t + 3 * l.hr, l.ab);
  const TRENDS = {
    ops: { fmt: avg3, of: l => l.ops ?? add(OBP(l), SLG(l)) },
    avg: { fmt: avg3, of: l => l.avg ?? ratio(l.h, l.ab) },
    obp: { fmt: avg3, of: l => l.obp ?? OBP(l) },
    slg: { fmt: avg3, of: l => l.slg ?? SLG(l) },
    rpg: { fmt: fix2, of: l => ratio(l.r, l.g), schedule: true },
    hrpg: { fmt: fix2, of: l => ratio(l.hr, l.g) },
    kpct: { fmt: pct1, of: l => ratio(l.so, l.pa) },
    bbpct: { fmt: pct1, of: l => ratio(l.bb, l.pa) },
    runs: { fmt: v => Number.isFinite(v) ? v : "–", of: l => l.r, schedule: true }
  };
  // Player charts: one stat by month beside the MLB figure for the same
  // months. Rate stats compare with the league rate; counting stats compare
  // with what an average MLB player would put up in the same playing time
  // (per plate appearance, or per inning). Volume stats have no comparison.
  const int = v => Number.isFinite(v) ? String(Math.round(v)) : "–";
  const ipFmt = v => Number.isFinite(v) ? `${Math.floor(v + 1e-9)}.${Math.round((v - Math.floor(v + 1e-9)) * 3)}` : "–";
  const one = v => Number.isFinite(v) ? v.toFixed(1) : "–";
  const METRICS = {
    hitters: {
      ops: { label: "OPS", fmt: avg3, of: l => add(OBP(l), SLG(l)) },
      avg: { label: "AVG", fmt: avg3, of: l => ratio(l.h, l.ab) },
      obp: { label: "OBP", fmt: avg3, of: OBP },
      slg: { label: "SLG", fmt: avg3, of: SLG },
      hr: { label: "HR", fmt: int, avgFmt: one, of: l => l.hr, per: "pa" },
      rbi: { label: "RBI", fmt: int, avgFmt: one, of: l => l.rbi, per: "pa" },
      sb: { label: "SB", fmt: int, avgFmt: one, of: l => l.sb, per: "pa" },
      pa: { label: "PA", fmt: int, of: l => l.pa, volume: true },
      g: { label: "G", fmt: int, of: l => l.g, volume: true }
    },
    pitchers: {
      era: { label: "ERA", fmt: fix2, of: l => ratio(27 * l.er, l.outs) },
      whip: { label: "WHIP", fmt: fix2, of: l => ratio(3 * (l.h + l.bb), l.outs) },
      so: { label: "K", fmt: int, avgFmt: one, of: l => l.so, per: "outs" },
      bb: { label: "BB", fmt: int, avgFmt: one, of: l => l.bb, per: "outs" },
      ip: { label: "IP", fmt: ipFmt, of: l => l.outs / 3, volume: true },
      w: { label: "W", fmt: int, of: l => l.w, volume: true },
      sv: { label: "SV", fmt: int, of: l => l.sv, volume: true },
      gs: { label: "GS", fmt: int, of: l => l.gs, volume: true },
      g: { label: "G", fmt: int, of: l => l.g, volume: true }
    }
  };
  const DEFAULT_METRIC = { hitters: "ops", pitchers: "era" };
  const PER_LABEL = { pa: "same PA", outs: "same innings" };
  const sumAll = lines => {
    const keys = new Set(lines.flatMap(l => Object.keys(l)));
    keys.delete("m");
    return Object.fromEntries([...keys].map(k => [k, lines.reduce((t, l) => t + (l[k] ?? 0), 0)]));
  };
  // The MLB figure to set beside a player's line for the same span.
  function mlbValue(cfg, mine, lg) {
    if (!lg || !mine || cfg.volume) return null;
    if (!cfg.per) return cfg.of(lg);
    const rate = ratio(cfg.of(lg), lg[cfg.per]);
    return rate == null ? null : rate * mine[cfg.per];
  }

  const LINE_KEYS = ["g", "r", "pa", "ab", "h", "d", "t", "hr", "bb", "hbp", "sf", "so"];
  const sumLines = lines => Object.fromEntries(LINE_KEYS.map(k => [k, lines.reduce((t, l) => t + (l[k] ?? NaN), 0)]));

  const CITY = { "New York": "NY", "Los Angeles": "LA", "Chicago": "CHI" };
  const shortName = t => t.replace(/^(New York|Los Angeles|Chicago) /, (m, city) => `${CITY[city]} `);
  const fmtDate = (iso, opts) => new Date(`${iso}T12:00:00`).toLocaleDateString("en-US", opts);
  const fmtTime = iso => new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const SUFFIX = ["th", "st", "nd", "rd"];
  const ordinal = n => n + (SUFFIX[(n % 100 - 20) % 10] || SUFFIX[n % 100] || SUFFIX[0]);

  function getJSON(path) {
    return fetch(path, { cache: "no-cache" }).then(res => {
      if (!res.ok) throw new Error(res.status === 404 ? "no data yet" : `HTTP ${res.status}`);
      return res.json();
    });
  }

  function withMonthly(s) {
    const done = s.games.filter(g => g.result);
    const monthOf = g => MONTH_NAMES[+g.date.slice(5, 7) - 1];
    const used = new Set(done.map(monthOf));
    const first = MONTHS.findIndex(m => used.has(m));
    const last = MONTHS.findLastIndex(m => used.has(m));
    s.monthly = first < 0 ? [] : MONTHS.slice(first, last + 1).map(m => {
      const inMonth = done.filter(g => monthOf(g) === m);
      return { m, rf: inMonth.reduce((t, g) => t + g.rf, 0), ra: inMonth.reduce((t, g) => t + g.ra, 0), n: inMonth.length };
    });
    return s;
  }

  const cache = {};
  function getSeason(id) {
    if (!cache[id]) {
      cache[id] = getJSON(`${DATA}/${id}.json`)
        .then(withMonthly)
        .catch(err => { delete cache[id]; throw err; });
    }
    return cache[id];
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDiff = n => (n > 0 ? "+" : "") + n;
  const fmtGB = v => (v == null || v === "-" || v === "0.0" ? "–" : v);

  const $ = id => document.getElementById(id);
  let seasons = [];
  let current = null;
  let filter = "all";
  let view = "division";
  let trend = "ops";
  let group = "hitters";
  let sortKey = STATS.hitters.sorts[0][0];
  let season = null;
  let requestId = 0;
  let open = null; // the player row showing a chart: { group, id, stat }

  function renderSeasonButtons() {
    $("seasons").innerHTML = seasons.map(id =>
      `<button type="button" data-id="${id}" aria-pressed="${id === current}">${id}</button>`
    ).join("");
  }

  function renderKpis(s) {
    const me = s.standings.find(r => r.us);
    $("kpi-title").textContent = `${s.label} · ${s.live ? "In progress" : "Final"}`;
    if (!me) {
      $("kpis").innerHTML = `<p class="pos">No standings for this season yet.</p>`;
      $("meta").textContent = s.label;
      return;
    }
    const played = me.w + me.l;
    const post = s.games.filter(g => g.type !== "R" && g.result);
    const pw = post.filter(g => g.result === "W").length;
    const pl = post.filter(g => g.result === "L").length;

    // With a postseason, the tiles after it combine regular season and
    // postseason. Rank and games back stay regular season only.
    let pct = me.pct, rd = me.rd, rpg = played ? me.rs / played : null, streak = me.streak, l10 = me.l10;
    if (post.length) {
      const all = s.games.filter(g => g.result === "W" || g.result === "L");
      const last = all[all.length - 1].result;
      const run = all.length - 1 - all.findLastIndex(g => g.result !== last);
      const ten = all.slice(-10);
      const w = ten.filter(g => g.result === "W").length;
      pct = ((me.w + pw) / (played + pw + pl)).toFixed(3).replace(/^0/, "");
      rd = me.rd + post.reduce((t, g) => t + g.rf - g.ra, 0);
      rpg = (me.rs + post.reduce((t, g) => t + g.rf, 0)) / (played + post.length);
      streak = `${last}${run}`;
      l10 = `${w}-${ten.length - w}`;
    }

    const both = post.length ? "*" : "";
    $("kpis").innerHTML = [
      ["Record", `${me.w}-${me.l}`],
      ...(post.length ? [["Postseason", `${pw}-${pl}`]] : []),
      ["Win %" + both, pct],
      ["AL East", me.divRank ? ordinal(me.divRank) : "–"],
      ["Games back", fmtGB(me.gb)],
      ["Run diff" + both, fmtDiff(rd)],
      ["Runs / game" + both, rpg == null ? "–" : rpg.toFixed(2)],
      ["Streak" + both, streak || "–"],
      ["Last 10" + both, l10 || "–"]
    ].map(([l, v]) => `<div class="kpi"><div class="v">${esc(v)}</div><div class="l">${l}</div></div>`).join("")
      + (post.length ? `<p class="kpi-note">* Regular season and postseason combined</p>` : "");
    const postNote = post.length ? ` · Postseason ${pw}-${pl}` : "";
    $("meta").textContent = `${s.label} · ${played} of ${GAMES_PER_SEASON} played${postNote}`;
  }

  function renderStandings(s) {
    const league = view === "league";
    $("standings-head").innerHTML = `<tr><th>#</th><th class="name">Team</th><th>W</th><th>L</th><th>PCT</th><th>${league ? "WCGB" : "GB"}</th>
      <th class="hide-sm">Home</th><th class="hide-sm">Away</th><th class="hide-sm">L10</th><th>Strk</th><th class="hide-sm">RD</th></tr>`;
    const rows = league
      ? s.standings.slice().sort((a, b) => (a.leagueRank ?? 99) - (b.leagueRank ?? 99) || parseFloat(b.pct) - parseFloat(a.pct))
      : s.standings.filter(r => r.division).sort((a, b) => (a.divRank ?? 99) - (b.divRank ?? 99));
    if (!rows.length) {
      $("standings").innerHTML = `<tr><td class="empty" colspan="11">No standings for this season.</td></tr>`;
      return;
    }
    $("standings").innerHTML = rows.map((r, i) => {
      const streakType = (r.streak || "")[0];
      return `
      <tr class="${r.us ? "us" : ""}">
        <td>${league ? r.leagueRank ?? i + 1 : r.divRank ?? i + 1}</td>
        <td class="name">${esc(shortName(r.team))}${r.clinched ? `<span class="clinch">${esc(r.clinched)}</span>` : ""}</td>
        <td>${r.w}</td><td>${r.l}</td><td>${esc(r.pct)}</td>
        <td>${esc(fmtGB(league ? r.wcgb : r.gb))}</td>
        <td class="hide-sm">${esc(r.home || "–")}</td><td class="hide-sm">${esc(r.away || "–")}</td><td class="hide-sm">${esc(r.l10 || "–")}</td>
        <td><span class="streak ${streakType}">${esc(r.streak || "–")}</span></td>
        <td class="hide-sm">${fmtDiff(r.rd)}</td>
      </tr>`;
    }).join("");
  }

  // Bar heights snap to whole 6px blocks, matching the striped bar fill.
  const BAR_HEIGHT = 168, BLOCK = 6;
  const blocks = (v, max) => Math.max(1, Math.round((v / max) * BAR_HEIGHT / BLOCK)) * BLOCK;

  function renderBars(s) {
    const cfg = TRENDS[trend];
    const label = $("trend").selectedOptions[0].textContent;
    const rows = cfg.schedule
      ? s.monthly.map(x => ({ m: x.m, us: { r: x.rf, g: x.n }, them: { r: x.ra, g: x.n } }))
      : (s.months || []).filter(x => x.bat || x.opp).map(x => ({ m: MONTH_NAMES[x.m - 1], us: x.bat, them: x.opp }));
    const val = l => (l ? cfg.of(l) : null);
    const names = cfg.schedule && trend === "runs" ? ["Scored", "Allowed"] : ["Yankees", "Opponents"];
    if (!rows.length) {
      $("bars").innerHTML = `<p class="pos">${cfg.schedule ? "No results yet." : `No monthly ${esc(label)} for this season yet.`}</p>`;
      $("bar-labels").innerHTML = $("legend").innerHTML = "";
      return;
    }
    const max = Math.max(...rows.flatMap(x => [val(x.us), val(x.them)]).filter(v => v != null), 0) || 1;
    const bar = (cls, v) => v == null
      ? `<div class="bar ${cls} none"></div>`
      : `<div class="bar ${cls}" style="height:${blocks(v, max)}px"></div>`;
    $("bars").innerHTML = rows.map(x => {
      const games = cfg.schedule ? ` in ${x.us.g} games` : "";
      return `
      <div class="bar-group" title="${x.m} ${esc(label)}: ${names[0]} ${cfg.fmt(val(x.us))}, ${names[1].toLowerCase()} ${cfg.fmt(val(x.them))}${games}">
        <div class="bar-pair">${bar("rf", val(x.us))}${bar("ra", val(x.them))}</div>
      </div>`;
    }).join("");
    $("bar-labels").innerHTML = rows.map(x => `<div class="bar-label">${x.m}</div>`).join("");
    // The legend carries the season figure for each side.
    const season = side => {
      const lines = rows.map(x => x[side]).filter(Boolean);
      return lines.length ? cfg.fmt(cfg.of(sumLines(lines))) : "–";
    };
    $("legend").innerHTML = `<span class="rf">${names[0]} ${season("us")}</span><span class="ra">${names[1]} ${season("them")}</span>`;
  }

  function renderSortOptions() {
    $("sort").innerHTML = STATS[group].sorts.map(([k, l]) =>
      `<option value="${k}"${k === sortKey ? " selected" : ""}>${l}</option>`).join("");
  }

  function renderPlayers(s) {
    const cfg = STATS[group];
    $("players-head").innerHTML = cfg.head;
    const list = s[group] || [];
    if (!list.length) {
      $("players").innerHTML = `<tr><td class="empty" colspan="15">No ${cfg.label} stats for this season.</td></tr>`;
      return;
    }
    const dir = cfg.ascending?.has(sortKey) ? 1 : -1;
    const rate = cfg.rate.has(sortKey);
    const rows = [...list].sort((a, b) => {
      if (rate && cfg.qualified(a) !== cfg.qualified(b)) return cfg.qualified(a) ? -1 : 1;
      const av = a[sortKey], bv = b[sortKey];
      if (av == null || bv == null) return (av == null) - (bv == null);
      return dir * (av - bv) || (b.pa ?? b.outs) - (a.pa ?? a.outs);
    });
    const metrics = METRICS[group];
    $("players-hint").hidden = !metrics;
    $("players").innerHTML = rows.map(p => {
      const isOpen = metrics && open && open.group === group && open.id === p.id;
      const cells = cfg.row(p);
      const cols = 1 + (cfg.pos ? 1 : 0) + cells.length;
      const caret = metrics ? `<span class="caret" aria-hidden="true">${isOpen ? "▾" : "▸"}</span>` : "";
      const attrs = metrics ? ` class="player${isOpen ? " open" : ""}" data-id="${p.id}" tabindex="0" aria-expanded="${!!isOpen}"` : "";
      return `
      <tr${attrs}>
        <td class="name">${caret}<img class="hs" loading="lazy" alt="" width="40" height="40" src="${headshot(p.id)}" onerror="this.style.visibility='hidden'">${esc(p.name)}</td>
        ${cfg.pos ? `<td><span class="pos">${esc(p.pos || "")}</span></td>` : ""}
        ${cells.map(([k, v, cls]) => {
          const c = [cls, isOpen && k === open.stat && "picked"].filter(Boolean).join(" ");
          const stat = metrics?.[k] ? ` data-stat="${k}" title="Chart ${metrics[k].label} by month"` : "";
          return `<td${c ? ` class="${c}"` : ""}${stat}>${v}</td>`;
        }).join("")}
      </tr>${isOpen ? `<tr class="detail"><td colspan="${cols}">${playerTrend(s, p, open.stat)}</td></tr>` : ""}`;
    }).join("");
  }

  // The expanded row: stat chips, then a two-line SVG chart (player vs MLB)
  // with a crosshair tooltip per month.
  function playerTrend(s, p, stat) {
    const box = $("players-box");
    const width = Math.max(280, Math.min(1120, box.clientWidth - 28));
    return `<div class="detail-in" style="width:${width}px">${trendBody(s, p, stat, width)}</div>`;
  }

  function trendBody(s, p, stat, width) {
    const metrics = METRICS[group];
    const cfg = metrics[stat];
    const chips = `<div class="chips" role="group" aria-label="Stat to chart">${Object.entries(metrics).map(([k, m]) =>
      `<button type="button" data-metric="${k}" aria-pressed="${k === stat}">${m.label}</button>`).join("")}</div>`;
    if (!p.months) return chips + `<p class="pos">Monthly splits aren't in this season's data yet; they arrive with the next data update.</p>`;
    const lgLines = s.league?.[group === "hitters" ? "hitting" : "pitching"] || [];
    const lgBy = new Map(lgLines.map(l => [l.m, l]));
    const mine = new Map(p.months.map(l => [l.m, l]));
    // The x axis spans the season's months, so missed months show as gaps.
    const span = [...new Set([...lgLines.map(l => l.m), ...(s.months || []).map(x => x.m), ...p.months.map(l => l.m)])].sort((a, b) => a - b);
    const first = span.findIndex(m => mine.has(m) || lgBy.has(m));
    const months = span.slice(Math.max(0, first));
    if (!months.length) return chips + `<p class="pos">No monthly games for ${esc(p.name)} this season.</p>`;
    const pts = months.map(m => {
      const l = mine.get(m);
      const v = l ? cfg.of(l) : null;
      return { m, l, me: Number.isFinite(v) ? v : null, lg: mlbValue(cfg, l, lgBy.get(m)) };
    });

    const total = p.months.length ? sumAll(p.months) : null;
    const lgTotal = lgLines.length ? sumAll(p.months.map(l => lgBy.get(l.m)).filter(Boolean)) : null;
    const seasonMe = total ? cfg.of(total) : null;
    const seasonLg = total && lgTotal && Object.keys(lgTotal).length ? mlbValue(cfg, total, lgTotal) : null;
    const avgFmt = cfg.avgFmt || cfg.fmt;
    const lgName = cfg.per ? `MLB avg (${PER_LABEL[cfg.per]})` : "MLB avg";
    const hasLg = pts.some(x => x.lg != null);
    const head = `<div class="trend-head"><b>${esc(p.name)} · ${cfg.label} by month</b>
      <span class="pos">Season ${cfg.fmt(seasonMe)}${seasonLg != null ? ` · ${lgName} ${avgFmt(seasonLg)}` : ""}</span></div>`;

    // Geometry. Counting stats start at zero; rate stats fit their range.
    const W = width, H = 210, L = 48, R = 16, T = 14, B = 28;
    const vals = pts.flatMap(x => [x.me, x.lg]).filter(v => v != null);
    if (!vals.length) return chips + head + `<p class="pos">No ${cfg.label} for these months.</p>`;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (cfg.per || cfg.volume) lo = 0;
    const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.1 || 1;
    if (!(cfg.per || cfg.volume)) lo = Math.max(0, lo - pad);
    hi += pad;
    const ticks = niceTicks(lo, hi, 4);
    lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
    const step = months.length > 1 ? (W - L - R) / (months.length - 1) : 0;
    const x = i => months.length > 1 ? L + i * step : (L + W - R) / 2;
    const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo || 1));
    const tickFmt = cfg.fmt === int || cfg.per ? (v => Number.isInteger(v) ? String(v) : v.toFixed(1)) : cfg.fmt;
    // Lines break where a month has no value.
    const path = key => pts.reduce((d, pt, i) => {
      if (pt[key] == null) return d;
      const prev = i > 0 && pts[i - 1][key] != null;
      return d + `${prev ? "L" : "M"}${x(i).toFixed(1)},${y(pt[key]).toFixed(1)}`;
    }, "");
    const lastMe = pts.findLastIndex(pt => pt.me != null);
    const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} ${cfg.label} by month${hasLg ? " compared with the MLB average" : ""}">
      ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 5}" text-anchor="end">${tickFmt(t)}</text>`).join("")}
      <line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      ${months.map((m, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${MONTH_NAMES[m - 1]}</text>`).join("")}
      <line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}"/>
      ${hasLg ? `<path class="lg" d="${path("lg")}"/>` : ""}
      <path class="me" d="${path("me")}"/>
      ${hasLg ? pts.map((pt, i) => pt.lg == null ? "" : `<rect class="dot-lg" x="${x(i) - 4}" y="${y(pt.lg) - 4}" width="8" height="8"/>`).join("") : ""}
      ${pts.map((pt, i) => pt.me == null ? "" : `<rect class="dot-me" x="${x(i) - 5}" y="${y(pt.me) - 5}" width="10" height="10"/>`).join("")}
      ${lastMe >= 0 ? `<text class="lbl-me" x="${x(lastMe)}" y="${y(pts[lastMe].me) - 10}" text-anchor="middle">${cfg.fmt(pts[lastMe].me)}</text>` : ""}
      ${months.map((m, i) => `<rect class="hit" data-i="${i}" x="${x(i) - (step || W) / 2}" y="${T}" width="${step || W}" height="${H - T - B}"/>`).join("")}
    </svg>`;
    // Tooltip text per month, read by the hover handler.
    const sample = l => !l ? "Did not play" : group === "hitters" ? `${l.pa} PA` : `${ipFmt(l.outs / 3)} IP`;
    const tips = pts.map(pt => `<span class="m">${MONTH_NAMES[pt.m - 1]} · ${sample(pt.l)}</span><br>`
      + `${esc(p.name.split(" ").slice(-1)[0])} ${cfg.fmt(pt.me)}${hasLg ? `<br>${lgName} ${avgFmt(pt.lg)}` : ""}`);
    const legend = `<div class="trend-legend"><span class="me">${esc(p.name)}</span>${hasLg ? `<span class="lg">${lgName}</span>` : cfg.volume ? `<span>No MLB comparison for playing time</span>` : `<span>No MLB monthly data for this season yet</span>`}</div>`;
    return chips + head + `<div class="trend-chart" data-tips='${esc(JSON.stringify(tips))}'>${svg}<div class="tip"></div></div>` + legend;
  }

  // Round axis ticks: 1, 2, 2.5 or 5 times a power of ten.
  function niceTicks(lo, hi, n) {
    const raw = (hi - lo) / n || 1;
    const mag = 10 ** Math.floor(Math.log10(raw));
    const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw);
    const out = [];
    for (let v = Math.floor(lo / step) * step; v <= hi + step * 1e-6; v += step) out.push(+v.toFixed(6));
    return out;
  }

  // MLB's image CDN, keyed by the Stats API player id; falls back to a generic silhouette.
  const headshot = id => `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_80,q_auto:best/v1/people/${id}/headshot/67/current`;

  // Scoreboard-style line score: away team on top, innings, then R/H/E.
  // Innings hide on narrow screens, leaving R/H/E.
  function lineScore(g) {
    const { away, home } = g.line;
    const n = Math.max(9, away.innings.length, home.innings.length);
    const nums = Array.from({ length: n }, (_, i) => i + 1);
    const cell = (v, i, side) => v ?? (side === home && g.result && i === home.innings.length - 1 ? "x" : "");
    const row = (t, isUs) => `<tr class="${isUs ? "me" : ""}"><td>${esc(t.team)}</td>`
      + nums.map(i => `<td class="inn hide-sm">${cell(t.innings[i - 1], i - 1, t)}</td>`).join("")
      + `<td class="rhe">${t.r ?? ""}</td><td>${t.h ?? ""}</td><td>${t.e ?? ""}</td></tr>`;
    return `<table class="line"><thead><tr><th></th>${nums.map(i => `<th class="inn hide-sm">${i}</th>`).join("")}<th class="rhe">R</th><th>H</th><th>E</th></tr></thead>`
      + `<tbody>${row(away, !g.home)}${row(home, g.home)}</tbody></table>`;
  }

  function renderGames(s) {
    const rows = s.games.filter(g =>
      filter === "all" || (filter === "results" ? g.result : !g.result));
    if (!rows.length) {
      $("games").innerHTML = `<tr><td class="empty" colspan="5">No ${filter === "upcoming" ? "upcoming games" : "games"} to show.</td></tr>`;
      return;
    }
    $("games").innerHTML = rows.map(g => {
      // Phones drop the weekday and use team abbreviations so the box score fits.
      const date = `<span class="hide-sm">${fmtDate(g.date, { weekday: "short" })}, </span>${fmtDate(g.date, { month: "short", day: "numeric" })}`;
      const opp = `<span class="hide-sm">${esc(shortName(g.opponent))}</span>`
        + `<span class="show-sm">${g.home ? "vs" : "@"} ${esc(g.oppAbbr || shortName(g.opponent))}</span>`;
      const tags = [g.series && (ROUND[g.type] || g.series), g.game && `Gm ${g.game}`].filter(Boolean)
        .map(t => `<span class="tag">${esc(t)}</span>`).join("");
      const live = !g.result && g.state === "Live";
      const off = NOT_PLAYED.test(g.status);
      const score = g.line ? lineScore(g)
        : g.result ? `${g.rf}–${g.ra}` : off || live ? "–" : g.timeTBD ? "TBD" : fmtTime(g.start);
      const result = g.result
        ? `<span class="res ${g.result}">${g.result}</span>`
        : `<span class="pos">${off ? esc(g.status) : live ? "Live" : "–"}</span>`;
      return `
      <tr class="${g.result ? "" : "upcoming"}">
        <td class="name">${date}</td>
        <td class="name">${opp}${tags}</td>
        <td class="hide-sm">${g.home ? "vs" : "@"}</td>
        <td class="box">${score}</td>
        <td>${result}</td>
      </tr>`;
    }).join("");
    // During a season, start the list a couple of games before the next one.
    const box = $("games-box");
    const next = rows.findIndex(g => !g.result && !NOT_PLAYED.test(g.status));
    const target = next > 0 && filter === "all" ? $("games").children[Math.max(0, next - 2)] : null;
    box.scrollTop = target ? target.offsetTop - box.querySelector("thead").offsetHeight : 0;
  }

  function setStatus(text) {
    $("status").textContent = text;
    $("status").classList.toggle("live", text === "LIVE");
  }

  function showError(message) {
    season = null;
    setStatus("OFFLINE");
    $("meta").textContent = message;
    $("kpis").innerHTML = `<p class="pos">${esc(message)}</p>`;
    $("standings").innerHTML = $("bars").innerHTML = $("bar-labels").innerHTML = $("legend").innerHTML = $("players").innerHTML = $("games").innerHTML = "";
  }

  async function render() {
    const id = ++requestId;
    setStatus("LOADING");
    try {
      const s = await getSeason(current);
      if (id !== requestId) return;
      season = s;
      setStatus(s.live ? "LIVE" : "FINAL");
      renderKpis(s);
      renderStandings(s);
      renderBars(s);
      renderPlayers(s);
      renderGames(s);
      const updated = new Date(s.updated).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      $("note").innerHTML = `${esc(s.label)} data from the <a href="https://statsapi.mlb.com/">MLB Stats API</a>. Player stats and monthly team stats other than runs are regular season only. Last change ${esc(updated)}. `
        + `Data © ${new Date().getFullYear()} MLB Advanced Media, L.P. Use of any content on this page acknowledges agreement to the terms posted at <a href="http://gdx.mlb.com/components/copyright.txt">gdx.mlb.com/components/copyright.txt</a>.`;
    } catch (err) {
      if (id !== requestId) return;
      showError(`Couldn't load ${current}: ${err.message}. Pick the season again to retry.`);
    }
  }

  $("seasons").addEventListener("click", e => {
    const btn = e.target.closest("button[data-id]");
    if (!btn || (btn.dataset.id === current && season)) return;
    current = btn.dataset.id;
    renderSeasonButtons();
    render();
  });

  $("view").addEventListener("change", e => {
    view = e.target.value;
    if (season) renderStandings(season);
  });

  $("group").addEventListener("change", e => {
    group = e.target.value;
    sortKey = STATS[group].sorts[0][0];
    renderSortOptions();
    if (season) renderPlayers(season);
  });

  $("trend").addEventListener("change", e => {
    trend = e.target.value;
    if (season) renderBars(season);
  });

  // Player rows: the name toggles the chart; a stat cell opens it on that
  // stat (or switches to it); the chips in the chart switch stats too.
  function openPlayer(id, stat) {
    const metrics = METRICS[group];
    if (!metrics) return;
    const same = open && open.group === group && open.id === id;
    if (!stat && same) open = null;
    else {
      const fromSort = sortKey === "outs" ? "ip" : sortKey;
      const pick = stat || (same && open.stat) || (metrics[fromSort] ? fromSort : DEFAULT_METRIC[group]);
      open = { group, id, stat: pick };
    }
    if (!season) return;
    renderPlayers(season);
    // A newly opened player moves to the top of the box so the chart is in view.
    if (open && !same) {
      const box = $("players-box"), row = box.querySelector("tr.open");
      if (row) box.scrollTop = row.offsetTop - box.querySelector("thead").offsetHeight;
    }
  }

  $("players").addEventListener("click", e => {
    const chip = e.target.closest("button[data-metric]");
    if (chip) { open.stat = chip.dataset.metric; renderPlayers(season); return; }
    const row = e.target.closest("tr.player");
    if (!row) return;
    const cell = e.target.closest("td[data-stat]");
    openPlayer(Number(row.dataset.id), cell?.dataset.stat);
  });

  $("players").addEventListener("keydown", e => {
    const row = e.target.closest?.("tr.player");
    if (!row || e.target !== row || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    openPlayer(Number(row.dataset.id));
    $("players").querySelector(`tr.player[data-id="${row.dataset.id}"]`)?.focus();
  });

  // Chart hover: crosshair on the month column plus a tooltip.
  $("players").addEventListener("pointermove", e => {
    const chart = e.target.closest(".trend-chart");
    if (!chart) return;
    const tip = chart.querySelector(".tip"), cross = chart.querySelector(".cross");
    const hit = e.target.closest(".hit");
    if (!hit) { tip.style.visibility = cross.style.visibility = "hidden"; return; }
    const i = Number(hit.dataset.i);
    const tips = JSON.parse(chart.dataset.tips);
    const box = hit.getBBox();
    const cx = box.x + box.width / 2;
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
    cross.style.visibility = "visible";
    tip.innerHTML = tips[i];
    tip.style.visibility = "visible";
    const rect = chart.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const flip = px > rect.width - tip.offsetWidth - 24;
    tip.style.left = `${flip ? px - tip.offsetWidth - 14 : px + 14}px`;
    tip.style.top = `${Math.max(0, py - tip.offsetHeight - 10)}px`;
  });
  $("players").addEventListener("pointerleave", () => {
    $("players").querySelectorAll(".tip, .cross").forEach(el => { el.style.visibility = "hidden"; });
  });

  // The open chart is drawn to the box's width; redraw it when that changes.
  let resizeTimer;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (open && season) renderPlayers(season); }, 150);
  });

  $("sort").addEventListener("change", e => {
    sortKey = e.target.value;
    if (season) renderPlayers(season);
  });

  $("filter").addEventListener("change", e => {
    filter = e.target.value;
    if (season) renderGames(season);
  });

  // Stadium lights: on = light mode, off = dark mode. Follows the system
  // setting until the viewer picks one.
  const darkQuery = matchMedia("(prefers-color-scheme: dark)");
  const theme = () => document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
  function renderLights() {
    const on = theme() === "light";
    $("lights").setAttribute("aria-pressed", String(on));
    $("lights").querySelector(".visually-hidden").textContent = `Stadium lights (${on ? "light" : "dark"} mode)`;
  }
  $("lights").addEventListener("click", () => {
    const next = theme() === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch {}
    renderLights();
  });
  darkQuery.addEventListener("change", renderLights);
  renderLights();

  renderSortOptions();
  getJSON(`${DATA}/index.json`)
    .then(index => {
      seasons = index.seasons;
      if (!seasons.length) throw new Error("no data yet");
      current = seasons[0];
      renderSeasonButtons();
      render();
    })
    .catch(err => showError(location.protocol === "file:"
      ? "Open this page through GitHub Pages or a local web server; browsers block data files opened straight from disk."
      : `Couldn't load data: ${err.message}. Run the "Update data" workflow on GitHub.`));
</script>
</body>
</html>
